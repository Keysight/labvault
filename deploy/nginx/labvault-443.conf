# LabVault TLS example (customer SKU).
# Prefer: sudo LABVAULT_PUBLIC_HOSTNAME=labvault.example \
#   LABVAULT_TLS_CERT=/etc/labvault/tls/fullchain.pem \
#   LABVAULT_TLS_KEY=/etc/labvault/tls/privkey.pem \
#   ./deploy/scripts/install-labvault-nginx.sh
#
# Upstream MUST match oneshot gunicorn bind: 127.0.0.1:8000

upstream labvault_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name labvault.example;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name labvault.example;

    ssl_certificate     /etc/labvault/tls/fullchain.pem;
    ssl_certificate_key /etc/labvault/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:LABVAULT_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 5g;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;

    location /static/ {
        alias /opt/labvault/current/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/lib/labvault/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://labvault_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
