# LabVault: bare http://<ip>/ → https://<ip>:9443/...
# Installed by deploy/scripts/install-labvault-http80.sh when no TLS vhost exists.
# Default customer TLS port is 9443. Gunicorn stays on 127.0.0.1:8000.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = / {
        return 302 https://$host:9443/login/;
    }

    location / {
        return 302 https://$host:9443$request_uri;
    }
}
