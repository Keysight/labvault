# LabVault lab/HTTP installs: bare http://<ip>/ → http://<ip>:8000/...
# Installed by deploy/scripts/install-labvault-http80.sh (all oneshots).
# When full TLS is enabled via install-labvault-nginx.sh, replace this with
# labvault-443.conf (port 80 → HTTPS) instead.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Typing only the IP (or hostname) lands on the login page.
    location = / {
        return 302 http://$host:8000/login/;
    }

    location / {
        return 302 http://$host:8000$request_uri;
    }
}
