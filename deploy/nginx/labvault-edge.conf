# LabVault edge (all oneshots): bare IP/hostname on :80 and :443.
# Installed by deploy/scripts/install-labvault-http80.sh
#
#   http://<ip>/  → https://<ip>/login/
#   https://<ip>/ → proxied to gunicorn :8000 (TLS terminated here)

upstream labvault_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = / {
        return 302 https://$host/login/;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/labvault/tls/labvault.crt;
    ssl_certificate_key /etc/labvault/tls/labvault.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:LABVAULT_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 5g;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;

    location / {
        proxy_pass http://labvault_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
