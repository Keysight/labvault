name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install python-ldap build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev
      - run: pip install -r requirements.txt
      - run: |
          export DJANGO_SECRET_KEY=ci-secret-key-must-be-at-least-32-chars-long
          export DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
          export DJANGO_DEBUG=false
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python tools/check_public_source.py --target .
          python tools/check_docs.py
          python manage.py test connect.tests.test_hard_dump connect.tests.test_bootstrap_defaults connect.tests.test_csrf_exempt_inventory connect.tests.test_labvault_cli_catalog connect.tests.test_redact_payload connect.tests.test_device_detail_render connect.tests.test_validate_external_config connect.tests.test_tls_settings connect.tests.test_diagnostics connect.tests.test_cli_ssh_auth connect.tests.test_labvault_cli_commands connect.tests.test_health_endpoints --verbosity=1
          cp -n .env.example .env
          docker compose -f deploy/compose/docker-compose.yml config
